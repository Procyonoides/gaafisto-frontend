<div class="container py-5">
  <div class="row">
    <div class="col-lg-12 mb-4">
      <h1 class="page-header">About Us</h1>
    </div>
  </div>

  <div class="row" *ngIf="profile">
    <div class="col-md-8">
      <h3>{{ profile.namaToko }}</h3>
      <p>{{ profile.description }}</p>

      <h5 class="mt-4">Visit Us</h5>
      <p>{{ profile.alamatToko }}</p>
      <p>{{ profile.kotaToko }}, {{ profile.provinsiToko }} {{ profile.kodePos }}</p>
    </div>

    <div class="col-md-4" *ngIf="contact">
      <h5>Reach Us</h5>
      <ul class="contact-list">
        <li><i class="fa fa-phone"></i> {{ contact.telpon }}</li>
        <li><i class="fa fa-envelope"></i> {{ contact.email }}</li>
      </ul>
      <a routerLink="/contact" class="btn btn-outline-primary btn-sm">Contact Us</a>
    </div>
  </div>
</div>
