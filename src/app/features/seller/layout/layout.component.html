<div class="admin-wrapper">
  <nav class="admin-sidebar">
    <div class="sidebar-brand">
      <h4>Seller Center</h4>
    </div>
    <ul class="sidebar-nav">
      <li [class.active]="isActiveRoute('/seller/products')">
        <a routerLink="/seller/products"><i class="fa fa-box"></i> My Products</a>
      </li>
      <li [class.active]="isActiveRoute('/seller/orders')">
        <a routerLink="/seller/orders"><i class="fa fa-shopping-cart"></i> My Orders</a>
      </li>
    </ul>
  </nav>

  <div class="admin-content">
    <header class="admin-topbar">
      <div class="topbar-user" *ngIf="currentUser">
        <span>{{ currentUser.firstName }} {{ currentUser.lastName }}</span>
        <button class="btn btn-sm btn-outline-danger" (click)="logout()">Logout</button>
      </div>
    </header>

    <main class="admin-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
